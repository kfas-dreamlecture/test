<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div class="dl-chat-panel" data-no-reveal="1" style="{{ panelStyle }}">
    <div class="dl-chat-head" style="background:#152452; padding:20px 22px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px">
      <div style="display:flex; flex-direction:column; gap:3px">
        <span style="font-size:15px; font-weight:800; color:#fff; letter-spacing:-.02em">드림렉쳐 안내 챗봇</span>
        <span style="font-size:12px; color:rgba(255,255,255,.5)">질문을 골라주시면 안내해드려요</span>
      </div>
      <button onClick="{{ close }}" style="border:none; background:transparent; color:rgba(255,255,255,.6); font-size:22px; line-height:1; cursor:pointer; padding:0" style-hover="color:#fff">×</button>
    </div>
    <div id="dl-chat-log" class="dl-chat-log" style="flex:1; min-height:0; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; background:#F4F2EC">
      <sc-for list="{{ messages }}" as="m" hint-placeholder-count="2">
        <div style="{{ m.rowStyle }}">
          <div style="{{ m.bubbleStyle }}">{{ m.text }}</div>
        </div>
      </sc-for>
    </div>
    <div class="dl-chat-opts" style="flex:none; max-height:132px; overflow-y:auto; padding:14px 16px 16px; background:#fff; border-top:1px solid #EEEBE2; display:flex; flex-wrap:wrap; gap:7px">
      <sc-for list="{{ options }}" as="q" hint-placeholder-count="4">
        <button onClick="{{ q.onClick }}" style="{{ q.style }}">{{ q.label }}</button>
      </sc-for>
    </div>
  </div>

  <button class="dl-fab" onClick="{{ toggle }}" style="{{ fabStyle }}">
    <span class="dl-fab-icon" style="font-size:18px; line-height:1">{{ fabIcon }}</span>
    <span class="dl-fab-label" style="font-size:15px; font-weight:800; white-space:nowrap">{{ fabLabel }}</span>
  </button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:640},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F0B429&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#F0B429&quot;,&quot;#F06AA6&quot;,&quot;#7FB3A0&quot;,&quot;#8FA7D8&quot;]}}">
const BACK = (t, l) => [{ label: l, to: t }, { label: "처음으로", to: "root" }];

const NODES = {
  root: {
    text: "안녕하세요! 드림렉쳐 안내 챗봇입니다. 어떤 사업이 궁금하신가요?",
    options: [
      { label: "방문특강", to: "visit" },
      { label: "초청특강", to: "invite" },
      { label: "거점특강", to: "hub" },
      { label: "드림렉쳐 커넥트", to: "connect" },
      { label: "드림렉쳐란?", to: "about" }
    ]
  },
  about: {
    text: "드림렉쳐는 재단의 지원을 받은 학자와 전문가가 전국의 청소년을 만나는 지식나눔 프로그램입니다. 2012년 첫 강연을 시작으로 학교를 찾아가고, 재단으로 초청하고, 지역 거점에서 한 학기를 함께하며, 장학생이 후배 세대를 만나는 자리로 이어오고 있습니다.",
    options: [{ label: "네 가지 사업 보기", to: "root" }]
  },

  visit: {
    text: "방문특강 “너만의 꿈을 키워라!” — 석학이 전국의 고등학교를 직접 찾아갑니다. 무엇이 궁금하신가요?",
    options: [
      { label: "방문특강이란?", to: "v1" },
      { label: "진로특강인가요?", to: "v2" },
      { label: "참가비", to: "v3" },
      { label: "신청 방법", to: "v4" },
      { label: "참여 인원", to: "v5" },
      { label: "강연 시간·구성", to: "v6" },
      { label: "선정 기준", to: "v7" },
      { label: "온라인 강연", to: "v8" },
      { label: "일정 변경·취소", to: "v9" },
      { label: "문의처", to: "v10" },
      { label: "처음으로", to: "root" }
    ]
  },
  v1: { text: "재단 장학금으로 박사 학위를 취득한 학자·전문가가 전국의 고등학교를 직접 방문(또는 온라인 Zoom)해 전공 소개, 전공 심화, 진로, 시사, 교양 등을 주제로 강연하는 지식나눔 프로그램입니다. 2012년 11월에 시작해 14년째 이어오고 있습니다.", options: BACK("visit", "방문특강 다른 질문") },
  v2: { text: "아니요. 대학 입시 설명회나 직업인 진로특강이 아닙니다. 석학이 자신의 학문 세계를 소개하며, 학생들이 스스로 진로와 가능성을 넓혀 보도록 돕는 지식나눔 프로그램입니다.", options: BACK("visit", "방문특강 다른 질문") },
  v3: { text: "참가비는 없습니다. 강연료·교통비 등 제반 비용은 전액 재단이 부담하며, 국고 지원은 받지 않습니다.", options: BACK("visit", "방문특강 다른 질문") },
  v4: { text: "고등학교 교사가 신청 페이지에서 온라인으로 직접 신청합니다. 학교 모집 기간은 8월 18일(화)부터 8월 31일(월)까지이며, 상단 ‘신청하기’ 버튼에서 바로 신청할 수 있습니다.", options: BACK("visit", "방문특강 다른 질문") },
  v5: { text: "학교별 30명 내외 모집을 권장하지만 인원 제한은 없습니다. 강연 주제에 관심 있는 학생이 모일수록 만족도가 높습니다.", options: BACK("visit", "방문특강 다른 질문") },
  v6: { text: "2시간 이내로 진행하며, 최소 90분 이상 확보가 필요합니다. 재단 소개 → 연사 소개 → 강연 및 질의응답 → 사진 촬영 순으로 진행됩니다.", options: BACK("visit", "방문특강 다른 질문") },
  v7: { text: "지역 균형, 일정, 신청 동기 등을 종합적으로 고려해 특정 지역에 편중되지 않도록 선정합니다. 연간 학교별 1명, 1회 강연이 가능합니다.", options: BACK("visit", "방문특강 다른 질문") },
  v8: { text: "가능합니다. 오프라인 학교 방문 외에 Zoom을 통한 온라인 강연도 진행하고 있어, 지역과 상관없이 참여할 수 있습니다.", options: BACK("visit", "방문특강 다른 질문") },
  v9: { text: "결과 공지 이후에는 일정 변경이 불가합니다. 강연을 취소할 경우 추후 신청이 제한될 수 있으니 신중하게 신청해 주세요. 부득이한 사정이 있다면 담당자에게 먼저 연락해 주시기 바랍니다.", options: BACK("visit", "방문특강 다른 질문") },
  v10: { text: "한국고등교육재단 지식나눔팀 드림렉쳐 담당자 — 이메일 dreamlecture@kfas.or.kr / 전화 02-6310-7876으로 문의해 주세요.", options: BACK("visit", "방문특강 다른 질문") },

  invite: {
    text: "초청특강 “더 넓은 세상으로!” — 전국의 고등학생을 재단으로 초청합니다. 무엇이 궁금하신가요?",
    options: [
      { label: "방문특강과 차이", to: "i1" },
      { label: "참여 대상", to: "i2" },
      { label: "하루 일정", to: "i3" },
      { label: "연사", to: "i4" },
      { label: "비용", to: "i5" },
      { label: "진행 횟수", to: "i6" },
      { label: "먼 지역 참여", to: "i7" },
      { label: "온라인 참여", to: "i8" },
      { label: "지난 강연 주제", to: "i9" },
      { label: "신청 방법", to: "i10" },
      { label: "처음으로", to: "root" }
    ]
  },
  i1: { text: "학교로 찾아가는 방문특강과 달리, 학생들이 재단으로 찾아옵니다.", options: BACK("invite", "초청특강 다른 질문") },
  i2: { text: "전국의 고등학생을 대상으로 하며, 학교 단위로 참여합니다.", options: BACK("invite", "초청특강 다른 질문") },
  i3: { text: "하루에 강연 3개 정도가 열리고, 질의응답과 퀴즈로 이어집니다.", options: BACK("invite", "초청특강 다른 질문") },
  i4: { text: "재단 출신 석학을 비롯해 외부 전문가까지, 학생들이 관심 있는 주제에 맞춰 연사를 섭외합니다.", options: BACK("invite", "초청특강 다른 질문") },
  i5: { text: "참가비가 없습니다. 버스 대절비까지 모두 지원해 드립니다.", options: BACK("invite", "초청특강 다른 질문") },
  i6: { text: "2013년 12월 첫 개최 이후 71회를 진행했고, 18,780명의 학생이 참여했습니다.", options: BACK("invite", "초청특강 다른 질문") },
  i7: { text: "네, 17개 시·도 전역에서 참여했습니다.", options: BACK("invite", "초청특강 다른 질문") },
  i8: { text: "현장을 온라인으로 송출하기는 어렵지만, 일부 강연은 유튜브 재생목록에서 다시 볼 수 있습니다.", options: BACK("invite", "초청특강 다른 질문") },
  i9: { text: "초청특강 페이지의 ‘연도별 강연 주제’에서 회차별 주제와 연사를 확인할 수 있습니다.", options: BACK("invite", "초청특강 다른 질문") },
  i10: { text: "학교 담당 선생님이 재단으로 신청합니다.", options: BACK("invite", "초청특강 다른 질문") },

  hub: {
    text: "거점특강 “꿈의 무대를 넓혀라!” — 지역 거점에서 한 학기를 함께합니다. 무엇이 궁금하신가요?",
    options: [
      { label: "거점특강이란?", to: "h1" },
      { label: "일회성 강연과 차이", to: "h2" },
      { label: "시작 시점", to: "h3" },
      { label: "참여 대상", to: "h4" },
      { label: "참석 횟수", to: "h5" },
      { label: "개인 신청", to: "h6" },
      { label: "비용", to: "h7" },
      { label: "지역 확대", to: "h8" },
      { label: "처음으로", to: "root" }
    ]
  },
  h1: { text: "한 명의 연사가 한 학교를 방문하는 방문특강과 달리, 거점특강은 지역의 거점 센터에 여러 학교의 학생들이 모여 교수님을 만나는 방식입니다.", options: BACK("hub", "거점특강 다른 질문") },
  h2: { text: "같은 학생들을 여러 차례 만나며 관계가 쌓입니다. 강연에서 그치지 않고 교수님의 연구실을 방문해 직접 보고 배우는 현장 교육도 함께 진행합니다.", options: BACK("hub", "거점특강 다른 질문") },
  h3: { text: "2025년에 시작해 현재까지 5회 진행했습니다.", options: BACK("hub", "거점특강 다른 질문") },
  h4: { text: "해당 지역의 고등학생입니다.", options: BACK("hub", "거점특강 다른 질문") },
  h5: { text: "한 학기에 2~3회 진행되며, 전체 회차 참여가 기본입니다.", options: BACK("hub", "거점특강 다른 질문") },
  h6: { text: "거점특강을 함께 운영하는 지역 센터를 통해 신청할 수 있습니다.", options: BACK("hub", "거점특강 다른 질문") },
  h7: { text: "참가비가 없습니다.", options: BACK("hub", "거점특강 다른 질문") },
  h8: { text: "거점은 순차적으로 확대하고 있습니다.", options: BACK("hub", "거점특강 다른 질문") },

  connect: {
    text: "드림렉쳐 커넥트 “화면 너머, 더 가까이!” — 온라인으로 이어지는 만남입니다. 무엇이 궁금하신가요?",
    options: [
      { label: "어떤 프로그램인가요?", to: "c1" },
      { label: "플랫폼", to: "c2" },
      { label: "개인 참여", to: "c3" },
      { label: "다시보기", to: "c4" },
      { label: "질문 시간", to: "c5" },
      { label: "참여 인원", to: "c6" },
      { label: "진행 주기", to: "c7" },
      { label: "참가비", to: "c8" },
      { label: "처음으로", to: "root" }
    ]
  },
  c1: { text: "한국고등교육재단 장학생이 자신의 전공과 진로 이야기를 직접 들려주는 전공 탐색 세미나입니다.", options: BACK("connect", "커넥트 다른 질문") },
  c2: { text: "Zoom 온라인 회의로 진행됩니다.", options: BACK("connect", "커넥트 다른 질문") },
  c3: { text: "드림렉쳐 거점특강 또는 방문특강에 참여한 학생이 신청 후 참석할 수 있습니다.", options: BACK("connect", "커넥트 다른 질문") },
  c4: { text: "다시보기는 별도로 제공하지 않습니다. 일정이 맞지 않아 참석이 어렵다면 다음 회차에 참석해 주세요.", options: BACK("connect", "커넥트 다른 질문") },
  c5: { text: "멘토에게 자유롭게 질문할 수 있는 시간이 마련되어 있습니다.", options: BACK("connect", "커넥트 다른 질문") },
  c6: { text: "정해진 제한 인원은 없으나, 경우에 따라 신청이 선착순으로 마감될 수 있습니다.", options: BACK("connect", "커넥트 다른 질문") },
  c7: { text: "학기 중 매월 1회 진행됩니다.", options: BACK("connect", "커넥트 다른 질문") },
  c8: { text: "참가비가 없습니다.", options: BACK("connect", "커넥트 다른 질문") }
};

class Component extends DCLogic {
  state = { open: false, node: "root", messages: [{ from: "bot", text: NODES.root.text }] };

  scrollLog() {
    setTimeout(() => {
      const el = document.getElementById("dl-chat-log");
      if (el) el.scrollTop = el.scrollHeight;
    }, 60);
  }

  pick(opt) {
    const next = NODES[opt.to];
    this.setState(s => ({
      node: opt.to,
      messages: s.messages.concat([{ from: "me", text: opt.label }, { from: "bot", text: next.text }])
    }));
    this.scrollLog();
  }

  componentDidMount() {
    this._onAccent = (e) => { if (e && e.detail) this.setState({ accentLive: e.detail }); };
    window.addEventListener("dl-accent", this._onAccent);
  }
  componentWillUnmount() { window.removeEventListener("dl-accent", this._onAccent); }

  renderVals() {
    const { open, node, messages } = this.state;
    const accent = this.state.accentLive ?? this.props.accent ?? "#FFD400";
    return {
      fabIcon: open ? "×" : "💬",
      fabLabel: open ? "닫기" : "궁금한 점 물어보기",
      fabStyle: "position:fixed; right:28px; bottom:28px; z-index:80; height:60px; padding:0 26px; border-radius:999px; border:2px solid #152452; transition:background .4s ease; background:" + accent + "; color:#152452; font-family:inherit; display:flex; align-items:center; gap:10px; cursor:pointer; box-shadow:0 14px 30px -12px rgba(21,36,82,.55)",
      panelStyle: "position:fixed; right:28px; bottom:100px; z-index:80; width:360px; height:min(520px, calc(100vh - 130px)); border-radius:18px; overflow:hidden; background:#fff; box-shadow:0 24px 60px -20px rgba(21,36,82,.45); display:flex; flex-direction:column; transition:opacity .22s ease, transform .22s ease; opacity:" +
        (open ? 1 : 0) + "; transform:translateY(" + (open ? 0 : 14) + "px); pointer-events:" + (open ? "auto" : "none"),
      messages: messages.map((m, n) => ({
        key: n,
        text: m.text,
        rowStyle: "display:flex; justify-content:" + (m.from === "me" ? "flex-end" : "flex-start"),
        bubbleStyle: m.from === "me"
          ? "max-width:78%; background:#152452; color:#fff; font-size:13.5px; line-height:1.65; padding:11px 15px; border-radius:14px 14px 4px 14px"
          : "max-width:86%; background:#fff; color:#2A3149; font-size:13.5px; line-height:1.7; padding:12px 15px; border-radius:14px 14px 14px 4px; border:1px solid #E7E3D8; text-wrap:pretty"
      })),
      options: (NODES[node] || NODES.root).options.map((o, n) => ({
        key: n,
        label: o.label,
        style: "border:1px solid " + (o.to === "root" ? "#DEDACF" : "#152452") + "; background:" + (o.to === "root" ? "#fff" : "#152452") + "; color:" + (o.to === "root" ? "#152452" : "#fff") + "; border-radius:999px; padding:8px 14px; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer",
        onClick: () => this.pick(o)
      })),
      toggle: () => { this.setState(s => ({ open: !s.open })); this.scrollLog(); },
      close: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
