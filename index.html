<script type="text/x-dc" data-dc-script="">
const ROUTES = ["home", "visit", "invite", "hub", "connect"];

class Component extends DCLogic {
  state = { route: "home" };

  componentDidMount() {
    this.sync = () => {
      const h = (location.hash || "").replace("#", "");
      if (ROUTES.indexOf(h) >= 0 && h !== this.state.route) {
        this.setState({ route: h });
        window.scrollTo(0, 0);
      }
    };
    this.sync();
    window.addEventListener("hashchange", this.sync);
  }

  componentWillUnmount() {
    window.removeEventListener("hashchange", this.sync);
  }

  renderVals() {
    const r = this.state.route;
    return {
      isHome: r === "home",
      isVisit: r === "visit",
      isInvite: r === "invite",
      isHub: r === "hub",
      isConnect: r === "connect"
    };
  }
}
</script>
